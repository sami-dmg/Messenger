<!DOCTYPE html>
<html lang="en" data-theme="system" class="transition-colors duration-500">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Chat App</title>
  
  <link rel="stylesheet" href="style.css">
  
  <script>
    tailwind.config = {
      
      darkMode: ['selector', '[data-theme="dark"]'], 
    }
  </script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
</head>
<body class="bg-primary-bg text-primary-text flex flex-col items-center justify-center h-screen">

  <div id="welcomeScreen" class="text-center">
    <h1 class="text-4xl font-bold mb-4">Welcome to Messenger</h1>
    
    <button id="startButton" class="btn-primary">Start Chatting</button>
  </div>

  <div id="loginScreen" class="hidden text-center p-6 bg-white dark:bg-gray-800 rounded-lg shadow-xl w-80">
    <h2 class="text-2xl font-bold mb-4">Sign In</h2>
    
    <button id="googleLogin" class="btn-primary w-full flex items-center justify-center">
      Sign in with Google
    </button>
    
  </div>

  <div id="chatScreen" class="hidden flex h-full w-full max-w-4xl max-h-[800px] bg-white dark:bg-gray-800 shadow-2xl rounded-lg overflow-hidden">
    
    <div class="w-1/4 p-4 border-r border-gray-200 dark:border-gray-700">
        <div class="flex justify-between items-center mb-4">
            <h3 id="userName" class="text-xl font-semibold">User</h3>
            <button id="logoutButton" class="text-red-500 hover:text-red-700 text-sm">Logout</button>
        </div>
        
        <h4 class="text-lg font-medium mb-2 border-t pt-2 border-gray-200 dark:border-gray-700">Online Users</h4>
        <div id="userList" class="space-y-1">
            </div>
    </div>
    
    <div class="w-3/4 flex flex-col">
        <div id="messages" class="flex-grow p-4 overflow-y-auto space-y-3">
            </div>
        
        <form id="messageForm" class="p-4 border-t border-gray-200 dark:border-gray-700 flex">
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-grow p-2 border border-gray-300 dark:border-gray-600 rounded-l-lg dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-primary-text">
            <button type="submit" class="bg-blue-500 text-white p-2 rounded-r-lg hover:bg-blue-600">Send</button>
        </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
